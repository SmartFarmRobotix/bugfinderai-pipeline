# Robot (Mixed scenario): the inference service and the session feeder on the device. The detections and the
# best-image pair go to the cloud through the Gatekeeper; the assessment and the report are made there.
# Profile "jetson": the TensorRT image (runtime nvidia). Profile "cpu": the ONNX Runtime image for a robot
# without a GPU. Profile "feeder": one session submission per run.
services:
  inference-jetson:
    profiles: ["jetson"]
    build:
      context: ../../inference
      dockerfile: Dockerfile.jetson-gpu
    image: ${INFERENCE_JETSON_IMAGE:-bugfinderai-inference:jetson}
    runtime: nvidia
    restart: unless-stopped
    environment: &inference_env
      APP_NAME: InferenceService
      ENVIRONMENT: robot-mixed
      INFERENCE_SERVICE_HOST: 0.0.0.0
      INFERENCE_SERVICE_PORT: 8010
      LOG_LEVEL: ${INFERENCE_LOG_LEVEL:-info}
      INFERENCE_STORAGE_DIR: /code/app/data
      INFERENCE_DATA_ROOT: /code/app/data
      INFERENCE_EXTERNAL_API_KEY: ${INFERENCE_EXTERNAL_API_KEY:?set INFERENCE_EXTERNAL_API_KEY}
      INFERENCE_USING_GATEKEEPER: "true"
      INFERENCE_GATEKEEPER_BASE_URL: ${GATEKEEPER_URL:?set GATEKEEPER_URL to the cloud Gatekeeper, e.g. http://cloud.example.org:8001}
      INFERENCE_GATEKEEPER_USERNAME: ${GK_USERNAME:?set GK_USERNAME}
      INFERENCE_GATEKEEPER_PASSWORD: ${GK_PASSWORD:?set GK_PASSWORD}
      INFERENCE_GATEKEEPER_TOKEN_ENDPOINT: /api/login/
      INFERENCE_GATEKEEPER_REGISTER_ENDPOINT: /api/register_service/
      INFERENCE_GATEKEEPER_TIMEOUT_SECONDS: 10
      INFERENCE_SERVICE_NAME: inference_edge
      INFERENCE_SELF_BASE_URL: http://edge.inference.invalid:8010/
      INFERENCE_ORCH_PUSH_ENABLED: "true"
      INFERENCE_ORCH_PUSH_PATH: /api/v1/sessions/
      INFERENCE_ORCH_SERVICE_NAME: orchestrator
      INFERENCE_BEST_IMAGE_PUSH_ENABLED: "true"
      INFERENCE_RS_SERVICE_NAME: reporting
      INFERENCE_RS_UPLOAD_PATH: /api/v1/openagri-report/pest-session-images/
      INFERENCE_SCENARIO: mixed
      INFERENCE_DETECTOR_IMPL: tensorrt
      INFERENCE_EXECUTION_TARGET: jetson
      INFERENCE_ENGINE_PATH: /code/app/model/model.engine
      INFERENCE_DETECTOR_PROFILE: edge-s-fp16
      INFERENCE_TARGET_CLASS_SET: '["aphid_infestation_region"]'
      INFERENCE_CONFIDENCE_FLOOR: "0.4"
      INFERENCE_TILE_BATCH: "12"
      # governs POST /internal/acceptance-smoke only
      INFERENCE_ACCEPTANCE_SMOKE_MODE: ci-dev
    volumes:
      - ${DATA_DIR:?set DATA_DIR to the directory shared by the inference service and the feeder}:/code/app/data
      - ${MODEL_DIR:?set MODEL_DIR to the directory holding the model and its two JSON files}:/code/app/model:ro
    ports:
      - ${INFERENCE_HOST_PORT:-8011}:8010
    networks:
      robot:
        aliases: [inference]
    healthcheck: &inference_health
      test: ["CMD", "curl", "-sf", "http://localhost:8010/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

  inference-cpu:
    profiles: ["cpu"]
    build:
      context: ../../inference
    image: ${INFERENCE_CPU_IMAGE:-bugfinderai-inference:cpu}
    restart: unless-stopped
    environment:
      <<: *inference_env
      INFERENCE_DETECTOR_IMPL: ort
      INFERENCE_EXECUTION_TARGET: cloud
      INFERENCE_ONNX_EXECUTION_PROVIDER: CPUExecutionProvider
      INFERENCE_ONNX_MODEL_PATH: /code/app/model/model.onnx
      # the profile that accepts the released S fp32 network; the tiled path is selected by the model's record
      INFERENCE_DETECTOR_PROFILE: legacy-full-frame
      INFERENCE_TILE_BATCH: "4"
    volumes:
      - ${DATA_DIR:?set DATA_DIR to the directory shared by the inference service and the feeder}:/code/app/data
      - ${MODEL_DIR:?set MODEL_DIR to the directory holding the model and its two JSON files}:/code/app/model:ro
    ports:
      - ${INFERENCE_HOST_PORT:-8011}:8010
    networks:
      robot:
        aliases: [inference]
    healthcheck: *inference_health

  feeder:
    profiles: ["feeder"]
    build:
      context: ../../feeder
    image: ${FEEDER_IMAGE:-bugfinderai-feeder:local}
    environment:
      REPLAY_DEPLOYMENT_PROFILE: ${FEEDER_PROFILE:-auto}
      REPLAY_DATA_ROOT: /code/app/data
      REPLAY_SESSION_ID: ${REPLAY_SESSION_ID:-}
      REPLAY_INFERENCE_BASE_URL: http://inference:8010
      REPLAY_INFERENCE_API_KEY: ${INFERENCE_EXTERNAL_API_KEY:?set INFERENCE_EXTERNAL_API_KEY}
      REPLAY_CLOUD_INFERENCE_BASE_URL: ${CLOUD_INFERENCE_URL:-}
      REPLAY_CLOUD_INFERENCE_API_KEY: ${CLOUD_INFERENCE_API_KEY:-}
      REPLAY_DEFAULT_LATITUDE: ${SESSION_LATITUDE:-}
      REPLAY_DEFAULT_LONGITUDE: ${SESSION_LONGITUDE:-}
      REPLAY_PARCEL_ID: ${SESSION_PARCEL_ID:-parcel-001}
      REPLAY_RESULT_FILE: /out/result.json
      REPLAY_ACCOUNTING_FILE: /out/accounting.json
    volumes:
      - ${DATA_DIR:?set DATA_DIR}:/code/app/data
      - ${OUT_DIR:-./out}:/out
    networks: [robot]

networks:
  robot:
    name: bugfinderai_robot
